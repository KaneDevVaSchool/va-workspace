server {
  listen 80;
  listen [::]:80;
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name workspace.vaschools.edu.vn;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  # Laravel Reverb HTTP API (PHP bắn sự kiện). Không đi qua Varnish.
  location /apps {
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_pass http://127.0.0.1:8081;
  }

  # Laravel Reverb WebSocket (trình duyệt). Không đi qua Varnish.
  location /app {
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://127.0.0.1:8081;
  }

  # --- PWA: header cache cho file tĩnh trong public/ ---------------------------
  # Các file này do nginx phục vụ trực tiếp (không qua Laravel). Khối regex static
  # bên dưới đặt `expires max` cho mọi .js/.png nên PHẢI có location riêng ở đây
  # (= và ^~ thắng regex), nếu không sw.js / icon PWA bị cache cực lâu.

  # Service worker: luôn hỏi lại server để nhận bản mới ngay khi deploy.
  location = /sw.js {
    expires off;
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
    access_log off;
    try_files $uri =404;
  }

  location = /manifest.json {
    types { }
    default_type application/manifest+json;
    expires off;
    add_header Cache-Control "no-cache";
    access_log off;
    try_files $uri =404;
  }

  location = /offline.html {
    expires off;
    add_header Cache-Control "no-cache";
    access_log off;
    try_files $uri =404;
  }

  # Icon/splash PWA giữ tên file cố định khi đổi hình -> không cache cứng.
  location ^~ /images/pwa/ {
    expires off;
    add_header Cache-Control "no-cache";
    add_header Access-Control-Allow-Origin "*";
    access_log off;
    try_files $uri =404;
  }

  # Bundle Vite có content-hash trong tên file -> cache vĩnh viễn; thiếu file thì 404
  # thật (không rơi về HTML của SPA để service worker khỏi cache nhầm).
  location ^~ /build/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*";
    access_log off;
    try_files $uri =404;
  }

  location / {
    {{varnish_proxy_pass}}
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_hide_header X-Varnish;
    proxy_redirect off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout      720;
    proxy_send_timeout         720;
    proxy_read_timeout         720;
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
    proxy_temp_file_write_size 256k;
  }

  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf|map)$ {
    add_header Access-Control-Allow-Origin "*";
    expires max;
    access_log off;
  }

  if (-f $request_filename) {
    break;
  }
}

server {
  listen 8080;
  listen [::]:8080;
  server_name workspace.vaschools.edu.vn;
  {{root}}

  try_files $uri $uri/ /index.php?$args;
  index index.php index.html;

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_intercept_errors on;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    try_files $uri =404;
    fastcgi_read_timeout 3600;
    fastcgi_send_timeout 3600;
    fastcgi_param HTTPS "on";
    fastcgi_param SERVER_PORT 443;
    fastcgi_pass 127.0.0.1:{{php_fpm_port}};
    fastcgi_param PHP_VALUE "{{php_settings}}";
  }

  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf|map)$ {
    add_header Access-Control-Allow-Origin "*";
    expires max;
    access_log off;
  }

  if (-f $request_filename) {
    break;
  }
}
