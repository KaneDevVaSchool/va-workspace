<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9a0036">
<title>Mất kết nối — VA Workspace</title>
<style>
  :root {
    color-scheme: light;
    --color-primary-900: #9a0036;
    --color-primary-50: #ffeff1;
    --color-text: #1f2430;
    --color-text-muted: #6b7280;
    --color-border: #e7e9ee;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: max(1.5rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right))
      max(1.5rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
    background: #ffffff;
    color: var(--color-text);
    font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    text-align: center;
  }
  .card {
    max-width: 24rem;
  }
  .icon {
    width: 4.5rem;
    height: 4.5rem;
    margin: 0 auto 1.25rem;
    border-radius: 9999px;
    background: var(--color-primary-50);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon svg {
    width: 2.25rem;
    height: 2.25rem;
    stroke: var(--color-primary-900);
  }
  h1 {
    font-size: 1.125rem;
    font-weight: 700;
    margin: 0 0 0.5rem;
  }
  p {
    margin: 0 0 1.5rem;
    color: var(--color-text-muted);
    font-size: 0.9375rem;
    line-height: 1.5;
  }
  button {
    appearance: none;
    border: none;
    border-radius: 0.75rem;
    padding: 0.75rem 1.5rem;
    background: var(--color-primary-900);
    color: #fff;
    font-family: inherit;
    font-size: 0.9375rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:active {
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 18h.01" />
        <path d="M9.172 15.172a4 4 0 0 1 5.656 0" />
        <path d="M6.343 12.343a8 8 0 0 1 11.314 0" />
        <path d="M3.515 9.515a12 12 0 0 1 16.97 0" />
        <path d="M2 2l20 20" />
      </svg>
    </div>
    <h1>Không có kết nối mạng</h1>
    <p>Trang này chưa được lưu sẵn để xem offline. Kiểm tra lại kết nối rồi thử tải lại.</p>
    <button onclick="window.location.reload()">Tải lại</button>
  </div>
</body>
</html>
